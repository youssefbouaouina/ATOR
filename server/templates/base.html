<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATOR DFIR - {% block title %}Overview{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  body { background:#f4f6f8; }
  .navbar-brand span { color:#e74c3c; font-weight:700; }
  .card-metric { border-left:5px solid #2c3e50; }
  .sev-critical { border-left-color:#c0392b !important; }
  .sev-high { border-left-color:#d35400 !important; }
  .sev-medium { border-left-color:#f39c12 !important; }
  .sev-low { border-left-color:#27ae60 !important; }
  .badge-critical { background:#c0392b; }
  .badge-high { background:#d35400; }
  .badge-medium { background:#f39c12; }
  .badge-low { background:#27ae60; }
  .chain-step { display:inline-block; padding:6px 14px; margin:2px; border-radius:20px;
                color:#fff; font-size:0.85rem; font-weight:600; }
  .mono { font-family:Consolas,monospace; font-size:0.82em; }
  table.data td, table.data th { font-size:0.86rem; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">ATOR <span>DFIR</span></a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link {{ 'active' if page=='overview' }}" href="/">Overview</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if page=='investigation' }}" href="/investigation">Investigation</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if page=='endpoints' }}" href="/endpoints">Endpoints</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if page=='containment' }}" href="/containment">Containment</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if page=='intel' }}" href="/intel">Threat Intel</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if page=='reports' }}" href="/reports">Reports</a></li>
      </ul>
    </div>
    <span class="navbar-text text-light small">Containment mode: DRY-RUN</span>
  </div>
</nav>
<main class="container-fluid px-4">
{% block content %}{% endblock %}
</main>
<footer class="text-center text-muted small my-4">ATOR DFIR Framework &middot; all timestamps UTC &middot; evidence manifests SHA-256 verified at ingestion</footer>
{% block scripts %}{% endblock %}
</body>
</html>
