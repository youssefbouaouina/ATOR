title: PowerShell Download Cradle
id: 9fe63f8e-2afc-502c-913a-a96b88d66410
status: stable
description: Detects PowerShell download cradles (IEX + WebClient download patterns).
logsource:
    category: process_creation
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains:
            - 'DownloadString'
            - 'DownloadFile'
            - 'Net.WebClient'
            - 'Invoke-WebRequest http'
            - 'IEX (New-Object Net'
    condition: selection
tags:
    - attack.execution
    - attack.command-and-control
    - attack.t1059.001
    - attack.t1105
level: high
