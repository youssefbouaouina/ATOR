title: Scheduled Task Creation via Schtasks
id: c2ad31de-c890-5e75-a6aa-9e1a6139fa32
status: stable
description: Detects creation of scheduled tasks, a common persistence mechanism.
logsource:
    category: process_creation
detection:
    selection_img:
        Image|endswith: '\schtasks.exe'
    selection_action:
        CommandLine|contains: '/create'
    condition: selection_img and selection_action
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1053.005
level: medium
