title: Credential Dumping Tool Mimikatz Execution
id: 75a1c6eb-61d7-5e00-8359-5861b6547f25
status: stable
description: Detects execution of mimikatz-style credential dumping commands.
logsource:
    category: process_creation
detection:
    selection_name:
        Image|contains:
            - 'mimikatz'
    selection_cmd:
        CommandLine|contains:
            - 'sekurlsa::logonpasswords'
            - 'lsadump::sam'
            - 'sekurlsa::pth'
    condition: 1 of them
tags:
    - attack.credential-access
    - attack.t1003.001
level: critical
