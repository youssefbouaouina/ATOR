title: Botnet / C2 Beacon Activity (Demo)
id: 9fe63f8e-2afc-502c-913a-a96b88d66505
status: test
description: >
    Detects the harmless demo marker representing a compromised host beaconing
    to a botnet command-and-control node. Pairs with the real reverse-shell
    network detection on loopback port 4444. Cross-platform.
x-ator-cause: botnet_c2_beacon_established
x-ator-investigation-hint: >
    Root cause is an active command-and-control channel. Identify the beaconing
    process, the destination (IP/domain/port) and cadence, and when the channel
    first opened. Correlate with the reverse-shell network detection, the dropper
    that installed it, and any persistence that keeps it alive across reboots.
logsource:
    category: process_creation
detection:
    selection:
        CommandLine|contains: 'ATOR_DEMO_BOTNET_BEACON'
    condition: selection
tags:
    - attack.command-and-control
    - attack.t1571
    - attack.t1071.001
level: high
