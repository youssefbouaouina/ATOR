title: Spyware / Keylogger Activity (Demo)
id: 9fe63f8e-2afc-502c-913a-a96b88d66504
status: test
description: >
    Detects the harmless demo marker representing spyware / keylogger behaviour
    capturing user input or credentials. Cross-platform.
x-ator-cause: spyware_keylogger_credential_theft
